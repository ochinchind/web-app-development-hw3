syntax = "proto3";

package hr.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "hr-service/core/gen/hr/v1;hrv1";

service DepartmentService {
  rpc CreateDepartment(CreateDepartmentRequest) returns (Department) {
    option (google.api.http) = {
      post: "/v1/departments"
      body: "*"
    };
  }

  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse) {
    option (google.api.http) = {
      get: "/v1/departments"
    };
  }

  rpc GetDepartment(GetDepartmentRequest) returns (Department) {
    option (google.api.http) = {
      get: "/v1/departments/{id}"
    };
  }

  rpc UpdateDepartment(UpdateDepartmentRequest) returns (Department) {
    option (google.api.http) = {
      put: "/v1/departments/{id}"
      body: "*"
    };
  }

  rpc PatchDepartment(PatchDepartmentRequest) returns (Department) {
    option (google.api.http) = {
      patch: "/v1/departments/{id}"
      body: "*"
    };
  }

  rpc DeleteDepartment(DeleteDepartmentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/departments/{id}"
    };
  }
}

message Department {
  string id = 1;
  string name = 2;
  string description = 3;
  string location = 4;
  int32 employee_count = 5;
  double average_salary = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateDepartmentRequest {
  string name = 1;
  string description = 2;
  string location = 3;
}

message ListDepartmentsRequest {
  string q = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListDepartmentsResponse {
  repeated Department departments = 1;
  int32 total = 2;
}

message GetDepartmentRequest {
  string id = 1;
}

message UpdateDepartmentRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string location = 4;
}

message PatchDepartmentRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string location = 4;
}

message DeleteDepartmentRequest {
  string id = 1;
}
